        wavelength_micron: 4.5
    wavelength_micron: 3.6_and_4.5
    event_coverage: full_phase_curve_products
    time_system: archive_product_time_system_to_be_audited
    local:
      source_directory: literature_data/WASP-121b/Spitzer-IRAC-P13242/source
      source_status: not_downloaded
      prepared_status: not_downloaded
      source_notes: >-
        The public Heritage Archive data need a reproducible BCD extraction
        and intrapixel/systematics audit before mapping.
    required_systematics:
      - IRAC intrapixel sensitivity correction (pixel-phase)
      - pointing and centroid regressors
      - time baseline and detector ramp terms
      - channel-specific correlated-noise and error-scale check
    map_readiness:
      white_light: archive_reduction_required
      spectral: archive_reduction_required
      note: Full phase is preferable to an eclipse-only fit, but the old IRAC systematics must be re-fit.
    sources:
      paper: https://arxiv.org/abs/2307.00669
      archive: https://irsa.ipac.caltech.edu/Missions/spitzer.html
      archive_note: Search the Spitzer Heritage Archive for program 13242 and the WASP-121b AORs.
    duplicate_reductions:
      - >-
        Different published reductions of P-13242 use the same IRAC photons.
        Select one primary reduction and use other reductions only for a
        robustness comparison.
      - >-
        The 3.6 and 4.5 micron channel time series are separate channel blocks,
        not duplicate visits when their AORs are distinct.

