  - id: wasp121_hst_wfc3_g141_go15134
    planet: WASP-121b
    facility: HST
    instrument: WFC3 G141
    program: GO-15134
    observation: two_full_phase_curve_visits
    unique_photons: >-
      Two HST visits: 2018-03-12/13 and 2019-02-03/04.  Fit each visit as its
      own block first, then test a shared-orbit model.
    detectors_orders:
      - name: G141 visit 2018
        wavelength_micron: 1.12-1.64
        local_source: literature_data/WASP-121b/HST-WFC3-G141/source/broadBand_lightCurve_2018.txt
      - name: G141 visit 2019
        wavelength_micron: 1.12-1.64
        local_source: literature_data/WASP-121b/HST-WFC3-G141/source/broadBand_lightCurve_2019.txt
    wavelength_micron: 1.12-1.64
    event_coverage: >-
      Each visit is about 40.3 hours and contains two secondary eclipses in
      the published full-phase design.  The local source also contains raw,
      unbinned spectral light curves and time-series spectra.
    exposure_seconds: 103
    time_system: JD_UTC_in_source; convert and document the adopted BJD_TDB correction before fitting
    local:
      source_directory: literature_data/WASP-121b/HST-WFC3-G141/source
      source_status: source_downloaded
      prepared_status: prepared_waiting_for_time_conversion
      prepared_directory: literature_data/WASP-121b/HST-WFC3-G141/prepared
      audit_file: literature_data/WASP-121b/HST-WFC3-G141/prepared/input_audit.json
      source_files:
        - broadBand_lightCurve_2018.txt
        - broadBand_lightCurve_2019.txt
        - SupplementaryData/timeSeriesSpectra/
        - SupplementaryData/spectroLightCurves_Raw/
      source_notes: >-
        Broadband and spectral NPZ files now exist.  The 2019 author spectral
        files carry 2018 timestamps, and 11 channels duplicate 2018 values.
        All 2019 spectral products are marked not fit-ready.  Broadband times
        still need a documented JD_UTC to BJD_TDB conversion.
    required_systematics:
      - HST orbit-long ramp or RECTE-style charge-trap model
      - visit and HST-orbit offsets/baselines
      - scan direction and detector-state terms when available
      - wavelength common-mode treatment for spectral bins
      - visit-specific error scale and residual correlation check
    map_readiness:
      white_light: source_ready_for_audit
      spectral: source_ready_for_audit
      note: Full-phase data should constrain longitude better than latitude after the HST audit.
    sources:
      paper: https://www.nature.com/articles/s41550-021-01592-w
      archive: https://mast.stsci.edu/portal/Mashup/Clients/Mast/Portal.html
      local_supplement: https://www.nature.com/articles/s41550-021-01592-w#Sec17
    duplicate_reductions:
      - >-
        The broad-band files, raw spectroscopic light curves, and time-series
        spectra are alternate views of the same two visits.  Select one source
        representation per analysis block.
      - >-
        Any later HST re-reduction of GO-15134 must be compared, not stacked,
        with these source products.

