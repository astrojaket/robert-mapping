staged_fit_order:
  - stage: 0
    name: data_and_provenance_audit
    action: >-
      Check shape, finite values, masks, time units, wavelength edges, event
      labels, and source checksums.  Record whether a product is raw,
      systematics-corrected, or only a published model.
    output: one audit JSON per photon set; no sampler
  - stage: 1
    name: full_phase_white_light
    data_sets:
      - wasp121_jwst_nirspec_g395h_go1729
      - wasp121_jwst_niriss_soss_gto1201
      - wasp121_hst_wfc3_g141_go15134
      - wasp121_tess_sector7
    action: >-
      Fit one visit/order/detector block at a time with fixed orbit and a
      degree-2 positive map.  Use mediumpurple for the best fit and show the
      sub-stellar point and the meridional hotspot offset with its error bar.
  - stage: 2
    name: full_phase_spectral_maps
    data_sets:
      - wasp121_jwst_nirspec_g395h_go1729
      - wasp121_jwst_niriss_soss_gto1201
      - wasp121_hst_wfc3_g141_go15134
    action: >-
      Fit a small, selected set of wavelength bins first.  Keep detector,
      order, visit, and channel systematics separate.  Increase the bin count
      only after white-light residuals and injection recovery pass.
  - stage: 3
    name: eclipse_only_validation
    data_sets:
      - wasp121_jwst_miri_lrs_go2961
      - wasp121_hst_wfc3_g102_go15135
      - wasp121_hst_wfc3_g141_go14767
      - wasp121_spitzer_irac_p13044_eclipses
      - wasp121_smarts_2mass_k
    action: >-
      Fit one eclipse or AOR at a time with strong ephemeris and map priors.
      Report longitude and latitude as weakly constrained unless recovery
      tests show otherwise.  Eclipse-only data have weaker longitude and
      latitude information than full phase curves.
  - stage: 4
    name: shared_orbit_stacked_model
    data_sets: all_validated_sets
    action: >-
      Concatenate only unique photon sets.  Share the orbit and coordinate
      convention, but keep one systematics and error block for every visit,
      detector, order, channel, and AOR.  Keep map coefficients separate at
      first.
  - stage: 5
    name: hierarchical_wavelength_maps
    data_sets: all_validated_spectral_sets
    action: >-
      Add wavelength-dependent map amplitudes with shrinkage around a shared
      morphology.  Use instrument response functions and keep the same
      eclipse/phase-curve event model.
  - stage: 6
    name: pressure_node_temperature_model
    data_sets: all_validated_spectral_sets
    action: >-
      Only after stages 1-5 pass, connect a small number of pressure-node
      temperature maps with contribution functions.  Do not fit an independent
      unconstrained map in every spectral bin.

reporting_rules:
  - >-
    Mark the sub-stellar longitude at 0 degrees on every map and longitude
    plot.  Report the hotspot as a meridionally averaged dayside brightness
    peak, with posterior error bars, not only a noisy 2-D pixel maximum.
  - >-
    Use a lighter purple for hotter/brighter pixels and mediumpurple for the
    best-fit curve or reference map.
  - >-
    State whether each result uses full phase, one eclipse, or multiple
    eclipses.  Do not compare an eclipse-only 2-D peak to a full-phase
    longitude without this label.
  - >-
    A different reduction of the same photons is a systematic robustness test,
    not an additional independent observation.
