      local o1 and o2 files are order products, not two visits.
    detectors_orders:
      - name: SOSS order 1
        wavelength_micron: approximately 0.8-2.85
        local_source: WASP-121b/SOSS/W-121b-exoTEDRF-WLC-o1.csv
      - name: SOSS order 2
        wavelength_micron: approximately 0.6-0.8
        local_source: WASP-121b/SOSS/W-121b-exoTEDRF-WLC-o2.csv
    wavelength_micron: 0.6-2.85
    event_coverage: >-
      Full orbit: two secondary eclipses and one transit.  Local products have
      3447 integrations at about 38.459 seconds cadence.
    cadence_seconds: 38.4594
    time_system: >-
      BMJD_TDB in the local CSV despite the BJD header.  Add 2400000.5 for
      BJD_TDB before fitting.
    local:
      source_directory: WASP-121b/SOSS
      source_status: source_ready_for_audit
      prepared_status: prepared_waiting_for_fit
      prepared_files:
        - literature_data/WASP-121b/JWST-NIRISS-SOSS/prepared/white_order1.npz
        - literature_data/WASP-121b/JWST-NIRISS-SOSS/prepared/white_order2.npz
      audit_file: literature_data/WASP-121b/JWST-NIRISS-SOSS/prepared/input_audit.json
      source_notes: >-
        The local products are processed/detrended light curves.  No source
        archive, mask, detector regressors, exposure time, or reduction
        manifest is present.  The NumPy products differ from the CSV fluxes;
        keep them as alternate products until provenance is resolved.
    required_systematics:
      - order-specific baseline and visit normalisation
      - detector/jitter regressors when the upstream reduction provides them
      - time-correlated noise or GP test on approximately 30-35 minute scales
      - stellar-variability and common-mode check
      - error-scale fit or a documented uncertainty inflation
    map_readiness:
      white_light: source_ready_for_audit
      spectral: source_ready_for_audit
      note: Do not start a map until the BMJD conversion and reduction choice are recorded.
    sources:
      paper: https://doi.org/10.3847/1538-3881/ae0e52
      preprint: https://arxiv.org/abs/2509.09760
      archive: https://mast.stsci.edu/portal/Mashup/Clients/Mast/Portal.html
      archive_note: Search the MAST portal for WASP-121b and GTO-1201; record the exact data release before fitting.
    duplicate_reductions:
      - >-
        exoTEDRF and NAMELESS products are independent reductions of the same
        JWST visit.  Use one as the primary fit and the other as a robustness
        check; never count both as independent photons.
      - >-
        The local exoTEDRF CSV and detrended NumPy arrays are alternate
        reductions/products.  The o1 and o2 files are orders, so they may be
        fitted as separate spectral blocks only after their provenance is
        fixed.

