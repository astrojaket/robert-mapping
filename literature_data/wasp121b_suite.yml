# WASP-121b observation-suite manifest
#
# This file records unique photon sets.  A detector, spectral order, or
# wavelength bin can be an analysis block within one photon set.  It is not a
# new observation.  This distinction prevents duplicate reductions from being
# counted as extra data.
#
# State policy: source files can be downloaded and audited before inference.
# No inference or simulation is implied by this manifest.

schema_version: 1
updated: 2026-08-29
target: WASP-121b
purpose: >-
  Keep every published phase-curve and eclipse light curve in one auditable
  suite for wavelength-dependent eclipse mapping.
environment:
  conda_environment: eclipse-mapping
  maximum_cpus: 3
  plotting:
    main_colour: mediumpurple
    temperature_map: lighter_purple_is_hotter_and_brighter
  current_policy:
    download_and_prepare: allowed
    inference: staged_only
    simulations: false

time_and_orbit:
  period_days: 1.27492504
  reference_transit_bjd_tdb: 2458119.72074
  longitude_convention: >-
    Positive longitude is east of the sub-stellar point in the direction of
    planetary rotation.  The sub-stellar point is longitude 0 degrees.
  time_rules:
    - >-
      Convert BMJD_TDB to BJD_TDB by adding 2400000.5 before using the common
      ephemeris.
    - >-
      Keep the original time column and the conversion in the preparation
      audit.  Never silently replace a time system.
    - >-
      Treat each detector/order/visit as its own nuisance block.  Share only
      parameters that the staged fit explicitly marks as shared.

status_legend:
  source_downloaded: The author or archive source is present locally.
  source_ready_for_audit: A source time series is present, but units, masks, or correction status still need an audit.
  prepared_waiting_for_fit: A robert-mapping input and audit exist; no new fit is started by this manifest.
  not_downloaded: A public source is known, but it is not present locally.
  archive_reduction_required: Raw archive data or a mixed archive needs a reproducible reduction before mapping.
  map_ready: The input passed the preparation checks needed for a staged map fit.
  eclipse_only_warning: One eclipse has weak longitude and latitude information; use strong priors and do not over-interpret a 2-D peak.

unique_photon_sets:
  - id: wasp121_jwst_nirspec_g395h_go1729
    planet: WASP-121b
    facility: JWST
    instrument: NIRSpec G395H
    program: GO-1729
    observation: one_full_phase_curve_visit
    unique_photons: >-
      One full-orbit visit.  NRS1 and NRS2 are two detector analysis blocks
      from this same visit, not two independent visits.
    detectors_orders:
      - name: NRS1
        global_channels: 0-145
        channel_count: 146
        wavelength_micron: 2.725-3.713
        prepared_file: literature_data/WASP-121b/JWST-NIRSpec-G395H/prepared/spectroscopic/nrs1_spectroscopic.npz
      - name: NRS2
        global_channels: 146-348
        channel_count: 203
        wavelength_micron: 3.823-5.170
        prepared_file: literature_data/WASP-121b/JWST-NIRSpec-G395H/prepared/spectroscopic/nrs2_spectroscopic.npz
    wavelength_micron: 2.725-5.170
    event_coverage: >-
      Full orbit: two secondary eclipses and one transit in the local 3434-
      integration product.  The NRS1 and NRS2 time columns differ by about
      2.54 seconds and must remain detector-specific.
    cadence_seconds: 38.8085
    time_system: BJD_TDB
    local:
      source_directory: literature_data/WASP-121b/JWST-NIRSpec-G395H/source
      source_status: source_downloaded
      prepared_status: prepared_waiting_for_fit
      prepared_manifest: literature_data/WASP-121b/JWST-NIRSpec-G395H/prepared/spectroscopic/spectroscopic_manifest.json
      source_notes: >-
        Zenodo v8 files contain flux, uncertainty, x/y jitter, wavelength
        edges, and published phase-curve/systematics model arrays.  All nine
        spectroscopic source checksums pass the strict Zenodo validation.
    required_systematics:
      - detector-specific x and y jitter regressors
      - time baseline and visit/segment normalisation
      - published systematics model retained for comparison, not silently used as a correction
      - independent detector error scale and residual check
      - verify exposure time; the local source records cadence but not a trusted integration-time column
    map_readiness:
      white_light: map_ready
      spectral: map_ready
      note: Full-phase data are the first spectral-map validation target.
    sources:
      paper: https://arxiv.org/abs/2301.03209
      archive: https://zenodo.org/records/20651891
      archive_doi: https://doi.org/10.5281/zenodo.20651891
    duplicate_reductions:
      - >-
        The NRS1/NRS2 white files and the 349-channel files describe the same
        visit at different spectral resolutions.  Do not add the white and
        spectral products as independent likelihood data.
      - >-
        Any NAMELESS, Eureka, or later re-reduction of this visit must be
        selected as a comparison product, not stacked with the Zenodo v8
        photons.

  - id: wasp121_jwst_niriss_soss_gto1201
    planet: WASP-121b
    facility: JWST
    instrument: NIRISS SOSS
    program: GTO-1201
    observation: one_full_phase_curve_visit
    unique_photons: >-
