name: eclipse-mapping
channels:
  - conda-forge
dependencies:
  # Keep one environment name on the laptop, Glamdring, and SLURM workers.
  - python=3.12
  - setuptools>=68
  - wheel
  - numpy>=2.0
  - scipy>=1.13
  - pandas>=2.2
  - xarray>=2024.6
  - h5netcdf>=1.3
  - pyyaml>=6.0
  - pydantic>=2.7
  - matplotlib>=3.9
  - arviz>=0.20
  - jax>=0.4.35
  - numpyro>=0.15
  - pytest>=8.0
  - pip
  - pip:
      - -e .
