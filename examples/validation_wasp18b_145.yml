schema_version: 1

# Posterior-sampling check for the central WASP-18b NIRISS wavelength bin.
# The full 25-bin validation uses `robert-mapping benchmark-wasp18b` first.
project:
  name: wasp18b-niriss-1p45um-validation
  seed: 20260829
  description: Positive degree-2 posterior check at 1.446 micron

data:
  file: ../literature_data/WASP-18b/JWST-NIRISS-SOSS/prepared/25bin/bin_08.npz
  format: npz
  time_column: time
  flux_column: flux
  flux_err_column: flux_err
  time_unit: day
  exposure_seconds: 8.856
  normalize: none

system:
  period_days: 0.941452382
  transit_time: 2459802.4078798564
  a_over_rstar: 3.48023
  radius_ratio: 0.09783
  inclination_degrees: 84.3532
  planet_flux_ratio: 0.0007
  limb_darkening_u1: 0.0
  limb_darkening_u2: 0.0
  eccentricity: 0.0

map:
  representation: pixels
  harmonic_degree: 2
  n_pixels: 16
  positive: true
  regularization: none
  entropy_penalty: 0.0
  pixel_log_sigma: 0.50
  pixel_prior_mean_ppm: 1500.0
  pixel_prior_sd_ppm: 750.0

model:
  null_model: fourier
  mapped_model: spherical_harmonic
  likelihood: gaussian
  noise_model: white
  include_light_delay: false
  integrate_exposure: true
  fit_orbit: false
  fit_limb_darkening: false
  fit_error_scale: true
  error_scale_log_sigma: 0.15

systematics:
  mode: corrected
  fit_offset: true
  polynomial_order: 0
  exponential_ramp: false

inference:
  sampler: nuts
  chains: 2
  warmup: 1000
  draws: 1000
  target_accept: 0.99
  dense_mass: true
  init_strategy: jitter+adapt_diag
  progress_bar: true

compute:
  profile: local
  jax_platform: cpu
  x64: true
  max_cpus: 3
  threads: 3
  quadrature_radial: 16
  quadrature_azimuth: 64

output:
  directory: ../results/wasp18b_145um_nuts
  save_resolved_config: true
  save_report: true
  overwrite: true
  best_fit_color: mediumpurple
