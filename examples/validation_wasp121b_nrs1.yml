schema_version: 1

# Independent Stage-1 map for the published WASP-121b NIRSpec/NRS1
# full-phase white light curve (Mikal-Evans et al. 2023).
project:
  name: wasp121b-nirspec-nrs1-validation
  seed: 20260829
  description: Independent NRS1 full-phase map and published-offset validation

data:
  file: ../literature_data/WASP-121b/JWST-NIRSpec-G395H/prepared/white_nrs1.npz
  format: npz
  time_column: time
  flux_column: flux
  flux_err_column: flux_err
  time_unit: day
  exposure_seconds: 38.8
  normalize: none

system:
  period_days: 1.27492504
  transit_time: 2459867.64262
  a_over_rstar: 3.79804
  radius_ratio: 0.122551
  inclination_degrees: 88.09
  # Published Y00-like mean phase-curve coefficient (A), not the dayside depth.
  planet_flux_ratio: 0.002030
  stellar_radius_rsun: 1.437
  limb_darkening_u1: 0.020
  limb_darkening_u2: 0.169
  eccentricity: 0.0

map:
  representation: direct_harmonics
  harmonic_degree: 1
  # Y00 plus the substellar and east-west dipole terms. Index 1 is the
  # north-south term, which a phase curve cannot identify reliably.
  active_harmonic_indices: [0, 2, 3]
  positive: false
  regularization: none
  entropy_penalty: 0.0
  pixel_log_sigma: 0.60

model:
  null_model: fourier
  mapped_model: spherical_harmonic
  fourier_degree: 1
  likelihood: gaussian
  noise_model: white
  include_light_delay: true
  integrate_exposure: true
  fit_orbit: false
  fit_limb_darkening: false
  fit_error_scale: false
  error_scale_log_sigma: 0.30
  fit_white_jitter: true
  jitter_prior_scale_ppm: 100.0

systematics:
  mode: multiplicative
  fit_offset: true
  polynomial_order: 1
  standardize_time: false
  exponential_ramp: false
  regressor_columns: []
  coefficient_prior_sigmas: [0.01, 0.01]
  multiplicative_composition: linearized

inference:
  sampler: nuts
  chains: 2
  warmup: 1000
  draws: 1000
  target_accept: 0.98
  dense_mass: true
  init_strategy: jitter+adapt_diag
  progress_bar: true

compute:
  profile: local
  jax_platform: cpu
  x64: true
  max_cpus: 3
  threads: 3
  quadrature_radial: 24
  quadrature_azimuth: 96

output:
  directory: ../results/wasp121b_nrs1_validation
  save_resolved_config: true
  save_report: true
  overwrite: true
  best_fit_color: mediumpurple
