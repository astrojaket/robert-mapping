schema_version: 1

project:
  name: wasp178b-fast-rejection-recovery
  seed: 20260818
  description: Small comparison with the prior WASP-178b OU/BIC calibration

data:
  kind: files
  # Supply this file locally. It is not distributed with the package.
  file: data/WASP-178b_NRS1_white_light.csv
  format: csv
  time_column: time_mjd_tdb
  flux_column: relative_flux
  flux_err_column: relative_flux_err
  time_unit: day
  exposure_seconds: 18.04
  normalize: none

system:
  period_days: 3.3448333
  transit_time: 61268.16605360
  a_over_rstar: 7.19
  radius_ratio: 0.1125
  inclination_degrees: 85.8
  planet_flux_ratio: 0.00239374
  eccentricity: 0.0

map:
  representation: harmonics
  harmonic_degree: 2
  positive: true

model:
  null_model: uniform_disk
  mapped_model: eclipse_map
  fit_baseline: true
  fit_ramp: true

compute:
  profile: local
  jax_platform: cpu
  max_cpus: 3
  threads: 2

recovery:
  enabled: true
  case: wasp178b
  injected_longitudes_degrees: [-27.0, 0.0, 27.0]
  hotspot_width_degrees: 40.0
  hotspot_fraction: 0.5
  # Eight cyclic residual shifts reproduce the 32-trial legacy calibration.
  trials_per_case: 8
  longitude_grid_min_degrees: -90.0
  longitude_grid_max_degrees: 90.0
  longitude_grid_step_degrees: 9.0
  width_grid_degrees: [20.0, 40.0, 60.0]
  timing_grid_seconds: [-60.0, 0.0, 60.0]
  detection_delta_bic: -6.0
  baseline_order: 2
  ramp_timescale_hours: 0.75
  correlated_noise: true
  correlated_amplitude_ppm: 61.820986
  correlation_timescale_seconds: 954.639
  extra_jitter_ppm: 66.142853

output:
  directory: ../results/recovery_wasp178b
  overwrite: true
  save_report: true
  best_fit_color: mediumpurple
