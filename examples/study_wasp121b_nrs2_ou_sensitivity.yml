schema_version: 1

project:
  name: wasp121b-nirspec-nrs2-ou-sensitivity
  seed: 20260912
  description: NRS2 full-phase map with an OU residual-noise sensitivity model

data:
  file: ../literature_data/WASP-121b/JWST-NIRSpec-G395H/prepared/white_nrs2.npz
  format: npz
  time_column: time
  flux_column: flux
  flux_err_column: flux_err
  time_unit: day
  exposure_seconds: 38.8
  normalize: none

system:
  period_days: 1.27492504
  transit_time: 2459867.64262
  a_over_rstar: 3.79804
  radius_ratio: 0.123668
  inclination_degrees: 88.09
  planet_flux_ratio: 0.002777
  stellar_radius_rsun: 1.437
  limb_darkening_u1: -0.011
  limb_darkening_u2: 0.161
  eccentricity: 0.0

map:
  representation: direct_harmonics
  harmonic_degree: 1
  active_harmonic_indices: [0, 2, 3]
  positive: false
  regularization: none

model:
  null_model: fourier
  mapped_model: spherical_harmonic
  fourier_degree: 1
  likelihood: gaussian
  noise_model: ou
  ou_amplitude_prior_scale_ppm: 200.0
  ou_timescale_prior_median_seconds: 900.0
  ou_timescale_prior_sigma_ln: 1.0
  jitter_prior_scale_ppm: 150.0
  include_light_delay: true
  integrate_exposure: true
  fit_orbit: false
  fit_limb_darkening: false
  fit_error_scale: false
  fit_white_jitter: false

systematics:
  mode: multiplicative
  fit_offset: true
  polynomial_order: 1
  standardize_time: false
  exponential_ramp: false
  regressor_columns: []
  coefficient_prior_sigmas: [0.01, 0.01]
  multiplicative_composition: linearized

inference:
  sampler: nuts
  chains: 3
  warmup: 2000
  draws: 2000
  target_accept: 0.995
  dense_mass: true
  init_strategy: jitter+adapt_diag
  progress_bar: true

compute:
  profile: local
  jax_platform: cpu
  x64: true
  max_cpus: 3
  threads: 3
  quadrature_radial: 24
  quadrature_azimuth: 96

output:
  directory: ../results/wasp121b_nrs2_ou_sensitivity
  save_resolved_config: true
  save_report: true
  overwrite: true
  best_fit_color: mediumpurple
