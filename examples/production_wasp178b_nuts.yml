schema_version: 1

project:
  name: wasp178b-fixed-detrending-production
  seed: 20260818
  description: Increased-sampling map fit after the fixed Hammond-style baseline removal

data:
  kind: files
  file: ../results/production_wasp178b_input/fixed_detrending_white_light.csv
  format: csv
  time_column: time_mjd_tdb
  flux_column: relative_flux
  flux_err_column: relative_flux_err
  time_unit: day
  exposure_seconds: 18.04
  normalize: none

system:
  period_days: 3.3448333
  # Fixed white-light midpoint 61269.84045886503 minus half one period.
  transit_time: 61268.16804221503
  a_over_rstar: 7.19
  radius_ratio: 0.1125
  inclination_degrees: 85.8
  planet_flux_ratio: 0.00239374
  eccentricity: 0.0
  stellar_radius_rsun: 1.0

map:
  representation: pixels
  harmonic_degree: 2
  n_pixels: 16
  # Exact NumPyro equivalent of legacy PyMC3 tau=0.1.
  pixel_log_sigma: 3.1622776601683795
  positive: true
  regularization: entropy
  entropy_penalty: 0.0

model:
  null_model: fourier
  mapped_model: spherical_harmonic
  likelihood: gaussian
  fit_baseline: false
  fit_ramp: false
  integrate_exposure: false
  include_light_delay: true

inference:
  sampler: nuts
  chains: 3
  warmup: 1500
  draws: 3000
  target_accept: 0.99
  init_strategy: jitter+adapt_diag
  dense_mass: true
  progress_bar: true

compute:
  profile: local
  jax_platform: cpu
  max_cpus: 3
  threads: 3
  quadrature_radial: 32
  quadrature_azimuth: 128

output:
  directory: ../results/production_wasp178b_nuts
  overwrite: true
  save_report: true
  best_fit_color: mediumpurple
