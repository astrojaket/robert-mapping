schema_version: 1

project:
  name: wasp178b-direct-harmonic-whitened-production
  seed: 20260821
  description: WASP-178b NRS1 fixed-detrending fit with direct harmonic posterior whitening

data:
  kind: files
  # This is the same fixed Hammond-style detrended light curve used by the
  # earlier production run. It keeps this run a sampler/parameterization test.
  file: ../results/production_wasp178b_input/fixed_detrending_white_light.csv
  format: csv
  time_column: time_mjd_tdb
  flux_column: relative_flux
  flux_err_column: relative_flux_err
  time_unit: day
  exposure_seconds: 18.04
  normalize: none

system:
  period_days: 3.3448333
  # Fixed white-light midpoint 61269.84045886503 minus half one period.
  transit_time: 61268.16804221503
  a_over_rstar: 7.19
  radius_ratio: 0.1125
  inclination_degrees: 85.8
  planet_flux_ratio: 0.00239374
  eccentricity: 0.0
  argument_of_periastron_degrees: 90.0
  limb_darkening_u1: 0.0182
  limb_darkening_u2: 0.595
  stellar_radius_rsun: 1.0

map:
  # Direct harmonic coefficients remove the seven null directions in the
  # legacy 16-pixel fit. The sampler uses a local posterior-whitening map.
  # Harmonic maps can contain negative coefficients, so positivity is checked
  # on the rendered map after sampling rather than imposed during NUTS.
  representation: direct_harmonics
  harmonic_degree: 2
  n_pixels: 16
  # Used to set the non-monopole harmonic prior scale relative to the planet
  # flux ratio. This matches the stable full-rank production prior.
  pixel_log_sigma: 0.75
  positive: false
  regularization: none
  entropy_penalty: 0.0

model:
  null_model: fourier
  mapped_model: spherical_harmonic
  likelihood: gaussian
  fit_baseline: false
  fit_ramp: false
  integrate_exposure: false
  include_light_delay: true

systematics:
  # The input has the fixed Hammond-style baseline removed. Keep this disabled
  # so the comparison isolates the map parameterization and sampler geometry.
  mode: corrected
  fit_offset: false
  polynomial_order: 0
  exponential_ramp: false
  ramp_timescale_hours: 0.75
  regressor_columns: []
  segment_column: null
  standardize_regressors: true
  coefficient_prior_sigma: 0.01

inference:
  sampler: nuts
  # Three chains and three worker threads respect the laptop limit. The total
  # saved draws matches the previous 4 x 3000 production run, with longer
  # warmup for the new parameterization.
  chains: 3
  warmup: 2000
  draws: 4000
  target_accept: 0.99
  init_strategy: median
  # Whitening makes a diagonal mass matrix sufficient and cheaper to adapt.
  dense_mass: false
  progress_bar: true

compute:
  profile: local
  jax_platform: cpu
  x64: true
  max_cpus: 3
  threads: 3
  jit: true
  quadrature_radial: 32
  quadrature_azimuth: 128

output:
  # Separate directory preserves results/production_wasp178b_nuts.
  directory: ../results/production_wasp178b_whitened_nuts
  save_resolved_config: true
  save_report: true
  overwrite: false
  best_fit_color: mediumpurple
