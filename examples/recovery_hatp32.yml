schema_version: 1

project:
  name: hatp32-fast-recovery
  seed: 20260812
  description: Fast comparison with the prior HAT-P-32b 60 ppm recovery

data:
  kind: synthetic
  time_unit: day
  exposure_seconds: 88.44

system:
  period_days: 2.150009
  transit_time: 2457740.0443955003
  a_over_rstar: 6.05
  radius_ratio: 0.1508
  inclination_degrees: 88.9
  planet_flux_ratio: 0.000445
  eccentricity: 0.0

map:
  representation: harmonics
  harmonic_degree: 2
  positive: true

model:
  null_model: uniform_disk
  mapped_model: eclipse_map
  fit_baseline: true
  fit_ramp: false

compute:
  profile: local
  jax_platform: cpu
  max_cpus: 3
  threads: 2

recovery:
  enabled: true
  case: hatp32
  injected_longitudes_degrees: [10.0]
  hotspot_width_degrees: 40.0
  hotspot_fraction: 0.8
  noise_ppm: 60.0
  # Eight noise realizations give a useful small recovery calibration.
  trials_per_case: 8
  longitude_grid_min_degrees: -90.0
  longitude_grid_max_degrees: 90.0
  longitude_grid_step_degrees: 3.0
  width_grid_degrees: [40.0]
  timing_grid_seconds: [0.0]
  detection_delta_bic: -6.0
  baseline_order: 0
  correlated_noise: false

output:
  directory: ../results/recovery_hatp32
  overwrite: true
  save_report: true
  best_fit_color: mediumpurple
